<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bengaluru Rental Chatbot</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg,#f0f4ff,#dbe6f6);
      margin: 0;
      padding: 0;
    }
    #chatbox {
      width: 450px;
      margin: 40px auto;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #header {
      background: linear-gradient(90deg,#0078d7,#00a6ff);
      color: #fff;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }
    #messages {
      flex: 1;
      height: 350px;
      overflow-y: auto;
      padding: 15px;
      background: #fafafa;
    }
    .msg {
      margin: 10px 0;
      padding: 10px 14px;
      border-radius: 20px;
      max-width: 75%;
      line-height: 1.4;
      font-size: 14px;
    }
    .user {
      background: #0078d7;
      color: #fff;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .bot {
      background: #e9ecef;
      color: #333;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }
    #options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: #f9f9f9;
    }
    .optionBtn {
      flex: 1;
      padding: 10px;
      background: #0078d7;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }
    .optionBtn:hover {
      background: #005fa3;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      margin: 8px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      font-size: 13px;
    }
    .card h4 {
      margin: 0 0 6px 0;
      color: #0078d7;
    }
    .card p {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div id="chatbox">
    <div id="header">🏠 Bengaluru Rental Assistant</div>
    <div id="messages"></div>
    <div id="options"></div>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const options = document.getElementById("options");

    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.className = "msg " + sender;
      msg.textContent = text;
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    function addCard(title, rent, size, furnishing, deposit, contact) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h4>${title}</h4>
        <p>💰 Rent: ${rent}</p>
        <p>📏 Size: ${size}</p>
        <p>🛋️ Furnishing: ${furnishing}</p>
        <p>🔑 Deposit: ${deposit}</p>
        <p>📞 Contact: ${contact}</p>
      `;
      messages.appendChild(card);
      messages.scrollTop = messages.scrollHeight;
    }

    function showOptions(optionList) {
      options.innerHTML = "";
      optionList.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "optionBtn";
        btn.textContent = opt.label;
        btn.onclick = () => opt.action();
        options.appendChild(btn);
      });
    }

    // Initial greeting
    addMessage("👋 Hi! I’m your Bengaluru rental assistant.\nWould you like to search by *Location* or *Budget*?", "bot");
    showOptions([
      { label: "📍 Location", action: () => chooseLocation() },
      { label: "💰 Budget", action: () => chooseBudget() }
    ]);

    function chooseLocation() {
      addMessage("📍 Please select an area:", "bot");
      showOptions([
        { label: "Rajajinagar", action: () => showHouse("Rajajinagar") },
        { label: "Whitefield", action: () => showHouse("Whitefield") },
        { label: "Koramangala", action: () => showHouse("Koramangala") },
        { label: "Indiranagar", action: () => showHouse("Indiranagar") },
        { label: "HSR Layout", action: () => showHouse("HSR") }
      ]);
    }

    function chooseBudget() {
      addMessage("💰 Please select your budget range:", "bot");
      showOptions([
        { label: "≤ ₹12,000", action: () => showHouse("BudgetLow") },
        { label: "₹15,000–₹25,000", action: () => showHouse("BudgetMid") },
        { label: "≥ ₹30,000", action: () => showHouse("BudgetHigh") }
      ]);
    }

    function showHouse(choice) {
      switch(choice) {
        case "Rajajinagar":
          addCard("2BHK in Rajajinagar","₹25,000/month","700 sqft","Semi-furnished","₹1,50,000","Owner via NoBroker");
          break;
        case "Whitefield":
          addCard("1RK in Whitefield","₹7,500/month","130 sqft","Semi-furnished","₹20,000","Owner via NoBroker");
          break;
        case "Koramangala":
          addCard("1BHK in Koramangala","₹10,000/month","600 sqft","Unfurnished","₹70,000","Dealer via 99acres");
          break;
        case "Indiranagar":
          addCard("3BHK in Indiranagar","₹25,000/month","1,200 sqft","Semi-furnished","Negotiable","Owner via MagicBricks");
          break;
        case "HSR":
          addCard("2BHK in HSR Layout","₹23,000/month","600 sqft","Semi-furnished","₹80,000","Dealer via 99acres");
          break;
        case "BudgetLow":
          addCard("1RK in Whitefield","₹7,500/month","130 sqft","Semi-furnished","₹20,000","Owner via NoBroker");
          break;
        case "BudgetMid":
          addCard("2BHK in Rajajinagar","₹25,000/month","700 sqft","Semi-furnished","₹1,50,000","Owner via NoBroker");
          break;
        case "BudgetHigh":
          addCard("3BHK Villa in RMV 2nd Stage","₹70,000/month","2,000 sqft","Semi-furnished","₹3,00,000","Owner via 99acres");
          break;
      }

      // Offer to search again
      showOptions([
        { label: "🔄 Search Again", action: () => restart() },
        { label: "📞 Contact Agent", action: () => addMessage("📞 Agent: 98765-43210", "bot") }
      ]);
    }

    function restart() {
      addMessage("Would you like to search by *Location* or *Budget*?", "bot");
      showOptions([
        { label: "📍 Location", action: () => chooseLocation() },
        { label: "💰 Budget", action: () => chooseBudget() }
      ]);
    }
  </script>
</body>
</html>
